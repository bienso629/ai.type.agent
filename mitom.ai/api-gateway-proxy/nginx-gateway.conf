# ==============================================================================
# CAU HINH NGINX CHO REVERSE PROXY GATEWAY: api-vn-sg.mitom.ai
# Upstream dich: https://api-us-ca.umodelverse.ai/v1/
# ==============================================================================

# 1. Chuyen hoa Header: Tu dong nhan ca x-api-key hoac Authorization Bearer
map $http_authorization $final_auth_header {
    default $http_authorization;
    ""      "Bearer $http_x_api_key";
}

# 2. Cau hinh gioi han tan suat goi de chong DDoS / Spam bot
limit_req_zone $binary_remote_addr zone=gateway_api_limit:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=gateway_conn_limit:10m;

# 3. Server chuyen huong HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-vn-sg.mitom.ai;

    return 301 https://$host$request_uri;
}

# 4. Server chinh HTTPS API Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-vn-sg.mitom.ai;

    # Duong dan chung chi SSL (Thay bang duong dan that cua ban)
    ssl_certificate /etc/letsencrypt/live/api-vn-sg.mitom.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-vn-sg.mitom.ai/privkey.pem;

    # Toi uu hoa giao thuc SSL/TLS hien dai
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # An thong tin may chu de bao mat
    server_tokens off;

    # Gioi han dung luong goi tin gui len (20MB)
    client_max_body_size 20M;

    # DNS Resolver de Nginx phan giai ten mien upstream on dinh
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Goc kiem tra trang thai Gateway (Ping)
    location = / {
        default_type application/json;
        return 200 '{"status":"online","service":"Mì Tôm AI Gateway","domain":"api-vn-sg.mitom.ai","upstream":"https://api-us-ca.umodelverse.ai/v1"}';
    }

    # Xu ly toan bo yeu cau /v1/*
    location /v1/ {
        # Ap dung gioi han chong spam
        limit_req zone=gateway_api_limit burst=30 nodelay;
        limit_conn gateway_conn_limit 20;

        # Chuyen tiep yeu cau sang umodelverse
        proxy_pass https://api-us-ca.umodelverse.ai/v1/;

        # Cau hinh SSL ket noi sang upstream
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Thiet lap Headers chuyen tiep
        proxy_set_header Host api-us-ca.umodelverse.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gui Authorization chuan (Bearer x-api-key hoac Bearer goc)
        proxy_set_header Authorization $final_auth_header;

        # ----------------------------------------------------------------------
        # TOI UU HOA DAC BIET CHO STREAMING LLM (Server-Sent Events / SSE)
        # ----------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tat hoan toan bo dem de nhan tung token chu tuc thi theo thoi gian thuc
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Thoi gian cho phan hoi dai cho cac model suy luan lon (DeepSeek R1, v.v.)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }
}
