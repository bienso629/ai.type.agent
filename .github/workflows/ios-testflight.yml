# CI Build Trigger: rebuild iOS TestFlight at 2026-10-07T06:25:24
name: Build iOS and publish to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-testflight:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify App Store Connect secrets
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Thieu secrets. Vao Settings > Secrets and variables > Actions > New repository secret de tao: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_P8 (toan bo noi dung file .p8), APPLE_TEAM_ID."
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Codemagic CLI tools (ky so va publish)
        run: pip3 install --break-system-packages codemagic-cli-tools

      - name: Kiem tra xac thuc App Store Connect API
        run: |
          set +e
          app-store-connect apps list --verbose > /tmp/api-test.log 2>&1
          CODE=$?
          cat /tmp/api-test.log
          if [ $CODE -ne 0 ]; then
            echo "::error::Xac thuc App Store Connect API that bai (exit $CODE). Log day du:"
            tail -40 /tmp/api-test.log | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit $CODE
          fi

      - name: Dam bao App ID va App record ton tai
        run: |
          set +e
          app-store-connect bundles create ai.type.agent.coder --name "AI Type Agent Coder" > /tmp/bundle.log 2>&1
          echo "--- bundle create (bo qua neu da ton tai) ---"
          tail -3 /tmp/bundle.log || true
          app-store-connect apps create ai.type.agent.coder --name "AI Type Agent" --primary-locale en-US --sku aitypeagent001 --platform IOS --company-name "bienso629" > /tmp/app.log 2>&1
          echo "--- app record create (bo qua neu da ton tai) ---"
          tail -3 /tmp/app.log || true
          exit 0

      - name: Initialize keychain va tai chung chi + provisioning profile
        run: |
          set +e
          keychain initialize > /tmp/kc.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error::keychain initialize that bai (exit $CODE). Log:"
            tail -20 /tmp/kc.log | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit $CODE
          fi
          tail -5 /tmp/kc.log

          # Neu chua co CERTIFICATE_PRIVATE_KEY thi tu tao private key moi cho buoc nay
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Tao private key tam thoi de dang ky Distribution Certificate..."
            openssl genrsa -out /tmp/cert_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          fi

          app-store-connect fetch-signing-files ai.type.agent.coder \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --verbose > /tmp/fetch.log 2>&1
          CODE=$?
          cat /tmp/fetch.log
          if [ $CODE -ne 0 ]; then
            echo "::error::fetch-signing-files that bai (exit $CODE). Log day du:"
            tail -40 /tmp/fetch.log | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit $CODE
          fi

          keychain add-certificates > /tmp/kcadd.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error::keychain add-certificates that bai (exit $CODE). Log:"
            tail -20 /tmp/kcadd.log | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit $CODE
          fi
          tail -5 /tmp/kcadd.log

          # Tim tat ca cac file .mobileprovision tai ve duoc
          MD_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          UD_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$MD_DIR" "$UD_DIR"

          # app-store-connect mac dinh luu vao $HOME/Library/MobileDevice/Provisioning Profiles/
          for f in "$MD_DIR"/*.mobileprovision "$UD_DIR"/*.mobileprovision; do
            if [ -f "$f" ]; then
              UUID=$(security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)
              if [ -n "$UUID" ]; then
                echo "Cai dat profile: $NAME (UUID: $UUID)"
                cp -f "$f" "$MD_DIR/$UUID.mobileprovision"
                cp -f "$f" "$UD_DIR/$UUID.mobileprovision"
                echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
                echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
                echo "PROFILE_PATH=$MD_DIR/$UUID.mobileprovision" >> "$GITHUB_ENV"
              fi
            fi
          done

      - name: Flutter pub get & pod install
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Configure code signing settings
        run: |
          set +e
          echo "Su dung profile: $PROFILE_PATH (Name: $PROFILE_NAME, UUID: $PROFILE_UUID)"
          xcode-project use-profiles \
            --project=ios/Runner.xcodeproj \
            --profile="$PROFILE_PATH" \
            --archive-method app-store > /tmp/profiles.log 2>&1
          CODE=$?
          cat /tmp/profiles.log
          if [ $CODE -ne 0 ]; then
            echo "::error::use-profiles that bai (exit $CODE). 10 dong cuoi cua log:"
            tail -10 /tmp/profiles.log | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit $CODE
          fi

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.type.agent.coder</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "ExportOptions.plist da tao voi teamID ${APPLE_TEAM_ID} va profile ${PROFILE_NAME}"

      - name: Build .ipa
        run: flutter build ipa --release --build-number=$GITHUB_RUN_NUMBER --export-options-plist=ios/ExportOptions.plist

      - name: Publish to TestFlight
        run: |
          APP_FILE=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Dang upload $APP_FILE len TestFlight..."
          app-store-connect publish "$APP_FILE" --enable-package-validation
