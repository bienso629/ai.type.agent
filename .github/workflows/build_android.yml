name: Build Android (.apk)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build-android/*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release (.apk)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d '+' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building AI Type Agent Android version: $VERSION (build ${{ github.run_number }})"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --build-number="${{ github.run_number }}" 2>&1 | tee build_android.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -iE 'error:|FAILURE:|Exception|What went wrong|BUILD FAILED' build_android.log | tail -n 10 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$code"
          fi

      - name: Package Android APK & Checksum
        run: |
          VERSION="${{ steps.app_version.outputs.VERSION }}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Khong tim thay $APK_SRC sau khi bien dich Android."
            exit 1
          fi

          rm -rf dist-android
          mkdir -p dist-android
          APK_NAME="ai-type-agent_${VERSION}_android.apk"
          cp -f "$APK_SRC" "dist-android/${APK_NAME}"
          (cd dist-android && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

          echo "=== HOAN TAT DONG GOI BAN ANDROID ==="
          ls -lh dist-android/
          cat "dist-android/${APK_NAME}.sha256"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-type-agent-android
          path: dist-android/*
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android build ${{ github.run_number }} (v${{ steps.app_version.outputs.VERSION }})
          body: |
            ## Bản cài đặt Android AI Type Agent v${{ steps.app_version.outputs.VERSION }} (Build ${{ github.run_number }})

            Tự động biên dịch bằng GitHub Actions (`ubuntu-24.04`, JDK 21, Flutter `3.44.2`).

            ### Tệp đầu ra:
            - `ai-type-agent_${{ steps.app_version.outputs.VERSION }}_android.apk`
            - `ai-type-agent_${{ steps.app_version.outputs.VERSION }}_android.apk.sha256`
          files: dist-android/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
