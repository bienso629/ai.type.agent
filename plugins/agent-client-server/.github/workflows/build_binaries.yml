name: Build Standalone Binaries (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ai-agent-client-linux
            binary_path: apps/plugins/agent-client-server/dist/ai-agent-client
          - os: windows-latest
            artifact_name: ai-agent-client-windows.exe
            binary_path: apps/plugins/agent-client-server/dist/ai-agent-client.exe
          - os: macos-latest
            artifact_name: ai-agent-client-macos
            binary_path: apps/plugins/agent-client-server/dist/ai-agent-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn requests paramiko openai pydantic

      - name: Run Build Script
        working-directory: apps/plugins/agent-client-server
        run: |
          python build_bin.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
