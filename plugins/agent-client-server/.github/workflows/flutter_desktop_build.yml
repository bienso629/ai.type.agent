name: Flutter Desktop Multi-Platform Build (Ubuntu, Windows, macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Desktop for ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os-name: Ubuntu (Linux)
            target: linux
            artifact-name: tadu-cloud-ai-agent-flutter-linux
          - os: windows-latest
            os-name: Windows (x64)
            target: windows
            artifact-name: tadu-cloud-ai-agent-flutter-windows
          - os: macos-latest
            os-name: macOS (Universal)
            target: macos
            artifact-name: tadu-cloud-ai-agent-flutter-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get


      # ----------------------------------------------------
      # 1. BUILD LINUX (Ubuntu .deb and .tar.gz)
      # ----------------------------------------------------
      - name: Build Flutter Linux Release
        if: matrix.target == 'linux'
        run: |
          chmod +x mobile/scripts/build_linux.sh
          ./mobile/scripts/build_linux.sh

      # ----------------------------------------------------
      # 2. BUILD WINDOWS (.zip and .exe)
      # ----------------------------------------------------
      - name: Build Flutter Windows Release
        if: matrix.target == 'windows'
        working-directory: mobile
        run: |
          flutter build windows --release
          mkdir -p ../dist-flutter
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ../dist-flutter/tadu-cloud-ai-agent-flutter-windows-x64.zip -Force

      # ----------------------------------------------------
      # 3. BUILD MACOS (.zip and .app)
      # ----------------------------------------------------
      - name: Build Flutter macOS Release
        if: matrix.target == 'macos'
        working-directory: mobile
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      # ----------------------------------------------------
      # UPLOAD ARTIFACTS
      # ----------------------------------------------------
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist-flutter/*
          if-no-files-found: error
