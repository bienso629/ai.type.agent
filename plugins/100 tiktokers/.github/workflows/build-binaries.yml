name: Build Binaries (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: 100tiktok-linux
            spec_file: build.spec
            output_path: dist/100tiktok-linux
          - os: windows-latest
            artifact_name: 100tiktok-win.exe
            spec_file: build-win.spec
            output_path: dist/100tiktok-win.exe
          - os: macos-latest
            artifact_name: 100tiktok-macos
            spec_file: build-macos.spec
            output_path: dist/100tiktok-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install fastapi uvicorn pydantic httpx requests pycryptodomex websocket-client pychrome psutil

      - name: Build Standalone Binary
        run: |
          pyinstaller --clean -y ${{ matrix.spec_file }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
