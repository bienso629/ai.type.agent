<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Perfect Holidays Simulation</title>
    <style>
        /* Xóa viền trắng mặc định và làm cho canvas chiếm toàn bộ màn hình */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none; /* Không cản trở việc click chuột vào canvas 3D */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 5px; }
        p { margin: 5px 0 0 0; font-size: 14px; color: #cccccc; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>P E R F E C T · H O L I D A Y S</h1>
    <p>Sử dụng Chuột trái để Xoay | Chuột phải để Di chuyển | Con lăn để Thu/Phóng</p>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    // Import công cụ để điều khiển camera bằng chuột
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. TẠO SCENE (CẢNH)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe0e0e0); // Màu nền tường sáng
    // Thêm sương mù mờ ảo cho có chiều sâu
    scene.fog = new THREE.Fog(0xe0e0e0, 5, 15);

    // 2. TẠO CAMERA
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 3, 5); // Đặt camera ở góc chéo nhìn xuống

    // 3. TẠO RENDERER (BỘ KẾT XUẤT)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Bật tính năng đổ bóng
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Bóng đổ mềm mại hơn
    document.body.appendChild(renderer.domElement);

    // 4. ÁNH SÁNG
    // Ánh sáng môi trường (làm sáng đều mọi thứ)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    // Ánh sáng định hướng (giống đèn trần hoặc ánh nắng, dùng để tạo bóng)
    const directionalLight = new THREE.DirectionalLight(0xffddaa, 1); // Ánh sáng hơi vàng ấm
    directionalLight.position.set(5, 8, 2);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // 5. CÁC VẬT THỂ 3D (MESHES)

    // --- Sàn nhà ---
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2; // Đặt sàn nằm ngang
    floor.receiveShadow = true; // Nhận bóng đổ từ vật khác
    scene.add(floor);

    // --- Bàn làm việc ---
    const deskGeo = new THREE.BoxGeometry(3, 0.1, 1.5);
    const deskMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 }); // Màu gỗ tối
    const desk = new THREE.Mesh(deskGeo, deskMat);
    desk.position.set(0, 1.5, 0); // Đưa bàn lên cao
    desk.castShadow = true;
    desk.receiveShadow = true;
    scene.add(desk);

    // Chân bàn (4 cái)
    const legGeo = new THREE.BoxGeometry(0.1, 1.5, 0.1);
    const legPositions = [
        [-1.4, 0.75, 0.65], [1.4, 0.75, 0.65],
        [-1.4, 0.75, -0.65], [1.4, 0.75, -0.65]
    ];
    legPositions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, deskMat);
        leg.position.set(...pos);
        leg.castShadow = true;
        scene.add(leg);
    });

    // --- Laptop ---
    const laptopBaseGeo = new THREE.BoxGeometry(0.8, 0.05, 0.6);
    const laptopMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.2 });
    const laptopBase = new THREE.Mesh(laptopBaseGeo, laptopMat);
    laptopBase.position.set(-0.5, 1.55, 0);
    laptopBase.castShadow = true;
    scene.add(laptopBase);

    const laptopScreenGeo = new THREE.BoxGeometry(0.8, 0.5, 0.05);
    const laptopScreen = new THREE.Mesh(laptopScreenGeo, laptopMat);
    laptopScreen.position.set(-0.5, 1.8, -0.275);
    laptopScreen.rotation.x = -0.1; // Mở hé màn hình
    laptopScreen.castShadow = true;
    scene.add(laptopScreen);

    // --- Hình khối tượng trưng cho người đang quay mặt lại (giống ảnh của bạn) ---
    // Phần thân
    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 32);
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69 }); // Màu da
    const body = new THREE.Mesh(bodyGeo, skinMat);
    body.position.set(0.5, 1.1, 1.2); // Ngồi trước bàn
    body.castShadow = true;
    scene.add(body);

    // Phần đầu
    const headGeo = new THREE.SphereGeometry(0.25, 32, 32);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.set(0.5, 1.9, 1.2);
    head.rotation.y = Math.PI / 4; // Quay đầu sang nhìn camera giống ảnh
    head.castShadow = true;
    scene.add(head);

    // --- Khối lập phương bay lơ lửng trên laptop (tạo hiệu ứng sinh động) ---
    const cubeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xaa0000 }); // Màu đỏ phát sáng nhẹ
    const floatingCube = new THREE.Mesh(cubeGeo, cubeMat);
    floatingCube.position.set(-0.5, 2.0, -0.1);
    scene.add(floatingCube);

    // 6. THÊM TƯƠNG TÁC CHUỘT (ORBIT CONTROLS)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Tạo độ mượt khi xoay
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Không cho camera chui xuống dưới mặt đất

    // 7. VÒNG LẶP ANIMATION (Cập nhật hình ảnh mỗi khung hình)
    function animate() {
        requestAnimationFrame(animate);

        // Xoay khối lập phương lơ lửng
        floatingCube.rotation.x += 0.02;
        floatingCube.rotation.y += 0.02;
        // Làm khối lập phương nảy lên xuống nhẹ nhàng
        floatingCube.position.y = 1.9 + Math.sin(Date.now() * 0.003) * 0.05;

        // Cập nhật điều khiển
        controls.update();

        // Vẽ lại khung hình
        renderer.render(scene, camera);
    }

    // Khởi động animation
    animate();

    // 8. XỬ LÝ KHI THAY ĐỔI KÍCH THƯỚC CỬA SỔ TRÌNH DUYỆT
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
