server {
    server_name chatbot.ai-acv.io.vn;
    root /var/www/chatbot.ai-acv.io.vn/web;
    index index.html;

    client_max_body_size 128m;

    # Backend Cloud Sync API
    location ^~ /api/ {
        root /var/www/chatbot.ai-acv.io.vn/backend;
        try_files $uri $uri/ @api_php;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    location @api_php {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/chatbot.ai-acv.io.vn/backend$uri.php;
        include fastcgi_params;
    }

    # Frontend Flutter Web SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chatbot.ai-acv.io.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chatbot.ai-acv.io.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = chatbot.ai-acv.io.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name chatbot.ai-acv.io.vn;
    return 404; # managed by Certbot
}

server {
    listen 8080;
    listen [::]:8080;
    server_name chatbot.ai-acv.io.vn _;

    root /var/www/chatbot.ai-acv.io.vn/web;
    index index.html;

    client_max_body_size 128m;

    location ^~ /api/ {
        root /var/www/chatbot.ai-acv.io.vn/backend;
        try_files $uri $uri/ @api_php_8080;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    location @api_php_8080 {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/chatbot.ai-acv.io.vn/backend$uri.php;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
