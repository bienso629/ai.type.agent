services:
  cloud-db:
    image: mariadb:10.6
    container_name: agent-chatbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
      MYSQL_DATABASE: agent_chatbot_db
      MYSQL_USER: agent_user
      MYSQL_PASSWORD: AgentPass2026!
    ports:
      - "3307:3306"
    volumes:
      - cloud_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agent-cloud-net

  cloud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-chatbot-php-api
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      DB_HOST: cloud-db
      DB_PORT: 3306
      DB_NAME: agent_chatbot_db
      DB_USER: agent_user
      DB_PASS: AgentPass2026!
    depends_on:
      - cloud-db
    networks:
      - agent-cloud-net

volumes:
  cloud_db_data:
    driver: local

networks:
  agent-cloud-net:
    driver: bridge
