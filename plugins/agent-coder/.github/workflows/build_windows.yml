name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Application
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content build.log | Select-String -Pattern 'error|Error|failed' | Select-Object -First 25
            foreach ($l in $lines) { Write-Host "::error::$($l.Line.Trim())" }
            exit $code
          }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-win -Force | Out-Null
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'dist-win\ai-type-agent_1.4.0_windows_x64.zip' -Force

      - name: Build Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\iscc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Host "::error::Không tìm thấy ISCC.exe"; exit 1 }
          & "$iscc" "scripts\installer_windows.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content iscc.log | Select-String -Pattern 'Error|error' | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $LASTEXITCODE
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-type-agent-windows
          path: |
            dist-win/*.zip
            dist-win/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          files: |
            dist-win/*.zip
            dist-win/*.exe
          make_latest: true
