        <script>
                // Khởi tạo bộ chọn ngày có Tiếng Việt
                flatpickr("#txtDate", {
                        dateFormat: "d/m/Y",
                        locale: "vn",
                        minDate: "today",
                        disableMobile: "true" // Ép dùng giao diện Flatpickr thay vì giao diện gốc trên điện thoại
                });

                document.getElementById('bookingForm').addEventListener('submit', async (e) => {
                        e.preventDefault();

                        const btnSubmit = document.getElementById('btnSubmit');
                        const statusMsg = document.getElementById('statusMsg');
                        btnSubmit.disabled = true;
                        btnSubmit.textContent = "Đang gửi...";
                        statusMsg.classList.remove('hidden', 'text-error', 'text-green-600');
                        statusMsg.classList.add('text-secondary');
                        statusMsg.innerHTML = "Đang kết nối...";

                        try {
                                // Lấy thông tin form
                                const name = document.getElementById('txtName').value;
                                const phone = document.getElementById('txtPhone').value;
                                const address = document.getElementById('txtAddress').value;
                                const date = document.getElementById('txtDate').value;

                                // Lấy dịch vụ quan tâm
                                const serviceCheckboxes = document.querySelectorAll('input[name="services"]:checked');
                                const services = Array.from(serviceCheckboxes).map(cb => cb.value).join(', ');

                                // Lấy thời gian đến
                                const timeRadio = document.querySelector('input[name="time_slot"]:checked');
                                const timeSlot = timeRadio ? timeRadio.value : '';
                                
                                // Tự động tách Giờ bắt đầu và Giờ kết thúc theo ca
                                let startTime = '';
                                let endTime = '';
                                if (timeSlot === 'Sáng') { startTime = '09:00'; endTime = '12:00'; }
                                else if (timeSlot === 'Chiều') { startTime = '13:00'; endTime = '17:00'; }
                                else if (timeSlot === 'Tối') { startTime = '17:00'; endTime = '19:00'; }

                                statusMsg.innerHTML = "Đang gửi dữ liệu lên Server...";

                                // Đóng gói dữ liệu để gửi đi
                                const bookingData = {
                                        name: name,
                                        phone: phone,
                                        address: address,
                                        services: services,
                                        startTime: startTime,
                                        endTime: endTime,
                                        date: date,
                                        createdAt: new Date().toLocaleString()
                                };

                                /*
                                 * Đã bật chức năng gọi API thật!
                                 */
                                const response = await fetch('https://apiv3.type.vn/v1/credentials/write', {
                                        method: 'POST',
                                        headers: { 
                                                'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(bookingData)
                                });
                                
                                if (!response.ok) {
                                        const errorData = await response.json();
                                        throw new Error(errorData.message || "Lỗi lưu dữ liệu từ server!");
                                }
                                
                                const result = await response.json();

                                statusMsg.innerHTML = `Đã lưu thành công vào Google Sheet!`;
                                statusMsg.classList.remove('text-secondary');
                                statusMsg.classList.add('text-green-600');
                                document.getElementById('bookingForm').reset();
                                
                        } catch (error) {
                                console.error(error);
                                statusMsg.innerHTML = "Lỗi: " + error.message;
                                statusMsg.classList.remove('text-secondary');
                                statusMsg.classList.add('text-error');
                        } finally {
                                btnSubmit.disabled = false;
                                btnSubmit.textContent = "ĐẶT LỊCH NGAY";
                        }
                });
        </script>
