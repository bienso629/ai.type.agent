<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinerU Split PDF Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-file-pdf"></i>
                <div>
                    <h2>MinerU Split View</h2>
                    <span class="badge">Pro 2.5</span>
                </div>
            </div>
            
            <div class="upload-section">
                <button id="load-default-btn" class="upload-btn primary-btn" style="margin-bottom: 12px;">
                    <i class="fa-solid fa-bolt"></i> Load "Thong tu 152"
                </button>
                <label for="file-upload" class="upload-btn secondary">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    Upload JSON
                </label>
                <input id="file-upload" type="file" accept=".json" />
            </div>

            <div class="file-info" id="file-info">
                <!-- Status will be injected here -->
            </div>

            <div class="page-nav" id="page-nav">
                <h3>Outline (JSON)</h3>
                <ul id="outline-list">
                    <li class="empty-outline">No document loaded</li>
                </ul>
            </div>
        </aside>

        <main class="viewer-area" id="viewer-area">
            <div class="split-screen" id="split-screen">
                <!-- Left Pane: Original PDF -->
                <div class="split-pane pdf-pane" id="pdf-pane">
                    <div class="pane-header">Original PDF</div>
                    <div class="pane-content">
                        <div class="empty-pdf" id="empty-pdf">
                            <i class="fa-regular fa-file-pdf"></i>
                            <p>No PDF loaded.</p>
                        </div>
                        <iframe id="pdf-iframe" style="display: none;" src="" title="Original PDF"></iframe>
                    </div>
                </div>

                <!-- Right Pane: MinerU JSON Render -->
                <div class="split-pane json-pane" id="json-pane">
                    <div class="pane-header">
                        MinerU JSON Output
                        <div class="header-actions">
                            <button id="overlay-toggle-btn" class="upload-btn secondary" style="padding: 6px 12px; margin-right: 15px; font-size: 0.8rem; width: auto; background-color: var(--card-bg); color: var(--text-primary);">
                                <i class="fa-solid fa-layer-group"></i> Toggle Overlay
                            </button>
                            <button id="regenerate-btn" class="upload-btn primary-btn" style="padding: 6px 12px; margin-right: 15px; font-size: 0.8rem; width: auto;">
                                <i class="fa-solid fa-rotate-right"></i> Regenerate JSON
                            </button>
                            <div class="zoom-controls">
                                <button id="zoom-out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                                <span id="zoom-level">100%</span>
                                <button id="zoom-in"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="pane-content relative">
                        <div class="empty-state" id="empty-state">
                            <div class="empty-icon">
                                <i class="fa-solid fa-code"></i>
                            </div>
                            <h2>Waiting for JSON</h2>
                            <p>Click "Load Thong tu 152" to view the split screen comparison.</p>
                        </div>
                        
                        <div class="document-container" id="document-container">
                            <!-- Pages will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
