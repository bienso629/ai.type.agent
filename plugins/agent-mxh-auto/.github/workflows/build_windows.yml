name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows EXE & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            echo "$innoPath" >> $env:GITHUB_PATH
          }
          $innoPath64 = "C:\Program Files\Inno Setup 6"
          if (Test-Path $innoPath64) {
            echo "$innoPath64" >> $env:GITHUB_PATH
          }

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Package Windows Release & Compile Installer
        shell: cmd
        run: |
          call scripts\build_windows.bat

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MXH-Tu-Dong-Windows-Release
          path: |
            dist-flutter/*.zip
            dist-flutter/*.exe
          retention-days: 14
