name: Build & Upload macOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-upload-macos:
    name: Build & Deploy macOS to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode Environment
        run: |
          flutter doctor -v
          xcodebuild -version

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Install Apple Certificate and Provisioning Profile
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PWD: "temporary_ci_keychain_password"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Decode and import Application Distribution Certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild

          # Decode and import Mac Installer Distribution Certificate
          if [ -n "$INSTALLER_CERT_BASE64" ]; then
            INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
            echo "$INSTALLER_CERT_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Append temporary keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Decode and install Provisioning Profile by UUID and Name
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/01fcf3ec-5684-433f-a48e-2596cf329206.provisionprofile"
          cp "$PROFILES_DIR/01fcf3ec-5684-433f-a48e-2596cf329206.provisionprofile" "$PROFILES_DIR/Agent_MXH_Auto.provisionprofile"

          echo "Certificates in keychain:"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build macOS Archive
        run: |
          BUILD_NUM=${GITHUB_RUN_NUMBER:-1}
          flutter build macos --release --config-only --build-name=1.0.0 --build-number=$BUILD_NUM || true
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/macos/Runner.xcarchive \
            archive \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

      - name: Package PKG Installer from Archive
        run: |
          mkdir -p dist-macos
          APP_PATH="build/macos/Runner.xcarchive/Products/Applications/agent_mxh_auto.app"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          
          # Verify the archived app exists
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for archived app..."
            APP_PATH=$(find build/macos/Runner.xcarchive -name "*.app" | head -n 1)
          fi
          echo "Found app at: $APP_PATH"

          # Find Installer Certificate
          INSTALLER_CERT=$(security find-identity -v "$KEYCHAIN_PATH" | grep -i "Installer" | head -n 1 | awk -F '"' '{print $2}')
          echo "Using installer signing certificate: $INSTALLER_CERT"

          # Sign the .pkg with Mac Installer certificate
          productbuild --component "$APP_PATH" /Applications --sign "$INSTALLER_CERT" --keychain "$KEYCHAIN_PATH" dist-macos/agent_mxh_auto.pkg
          echo "Created installer package: dist-macos/agent_mxh_auto.pkg"

          # Create zip for manual direct use
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/dist-macos/agent_mxh_auto_macos.zip" "$(basename "$APP_PATH")"
          cd "$GITHUB_WORKSPACE"

      - name: Upload to TestFlight via altool
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "Uploading package to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f dist-macos/agent_mxh_auto.pkg \
            --type macos \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress || echo "TestFlight upload step finished with warnings/errors."

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build-Package
          path: |
            dist-macos/*.pkg
            dist-macos/*.zip
          retention-days: 7
