name: Build Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-linux:
    name: Build Linux Ubuntu Bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev tar gzip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Build Flutter Linux Application
        run: |
          flutter build linux --release

      - name: Package Portable Tarball
        run: |
          mkdir -p dist-flutter
          cp -r build/linux/x64/release/bundle mxh-linux-bundle
          cat > mxh-linux-bundle/chay-mxh-tu-dong.sh << 'SCRIPT'
          #!/bin/bash
          # Kich hoat ung dung MXH Tu Dong (Linux)
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/agent_mxh_auto" "$@"
          SCRIPT
          chmod +x mxh-linux-bundle/chay-mxh-tu-dong.sh mxh-linux-bundle/agent_mxh_auto
          cp README.md mxh-linux-bundle/ || true
          tar -czf dist-flutter/MXH-Tu-Dong-Portable-Ubuntu-x64.tar.gz mxh-linux-bundle
          echo "Portable tarball created at: dist-flutter/MXH-Tu-Dong-Portable-Ubuntu-x64.tar.gz"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MXH-Tu-Dong-Ubuntu-Release
          path: |
            dist-flutter/*.tar.gz
          retention-days: 14
