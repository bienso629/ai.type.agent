name: Build Linux Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-linux:
    name: Build Linux Ubuntu Installer (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg python3-pil

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Build Flutter Linux Application
        run: |
          flutter build linux --release

      - name: Package Debian Installer (.deb)
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
          ls -lh dist-flutter/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MXH-Tu-Dong-Ubuntu-Installer
          path: |
            dist-flutter/*.deb
            dist-flutter/install.sh
          retention-days: 14
